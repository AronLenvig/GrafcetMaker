# Live collaboration: <app path>/api/room (the availability check) and <app path>/api/room/<id>
# (WebSockets) go to the relay (server/relay.ts). Included by deploy/nginx.conf when present;
# deploy/docker-compose.yml mounts it, with the relay as the service "relay".
location ~ /api/room(/[0-9a-z]{20})?/?$ {
    proxy_pass http://relay:8081;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    # Sessions stay open for hours; the relay pings every 30 s.
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
}
