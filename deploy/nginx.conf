server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # Fingerprinted assets never change.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Live collaboration relay, when deploy/relay-proxy.conf is mounted (deploy/docker-compose.yml).
    include /etc/nginx/snippets/relay*.conf;

    # Entry points must revalidate so updates (and the service worker) are picked up.
    location ~* (index\.html|sw\.js|registerSW\.js|manifest\.webmanifest)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # An address that does not exist: status 404, and a page that leads to the editor.
    error_page 404 /404.html;

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ =404;
    }
}
