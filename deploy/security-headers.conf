# The full Content-Security-Policy ships as a <meta> tag in index.html (it carries the hash of the
# inline theme script). Headers below add what a <meta> CSP cannot express.
add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
