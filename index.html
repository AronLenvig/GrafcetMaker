<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The app's root, for the language pages (<lang>/index.html) and after the address changes. -->
    <base href="./" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="light dark" />
    <title>Free online GRAFCET editor and simulator (IEC 60848) | GrafcetMaker</title>
    <meta
      name="description"
      content="Draw, check and simulate GRAFCET charts (IEC 60848) in your browser. Free and open source, works offline. Export to PDF, SVG, Structured Text and PLCopen XML."
    />
    <!-- The site URL placeholders are filled in from SITE_URL (vite.config.ts). -->
    <link rel="canonical" href="__SITE_URL__" />
    <link rel="alternate" hreflang="x-default" href="__SITE_URL__" />
    <link rel="alternate" hreflang="en" href="__SITE_URL__en/" />
    <link rel="alternate" hreflang="fr" href="__SITE_URL__fr/" />
    <link rel="alternate" hreflang="de" href="__SITE_URL__de/" />
    <link rel="alternate" hreflang="es" href="__SITE_URL__es/" />
    <link rel="alternate" hreflang="da" href="__SITE_URL__da/" />
    <link rel="alternate" hreflang="sv" href="__SITE_URL__sv/" />
    <link rel="alternate" hreflang="pt" href="__SITE_URL__pt/" />
    <link rel="alternate" hreflang="pl" href="__SITE_URL__pl/" />
    <link rel="alternate" hreflang="ru" href="__SITE_URL__ru/" />
    <link rel="alternate" hreflang="zh" href="__SITE_URL__zh/" />
    <link rel="alternate" hreflang="hi" href="__SITE_URL__hi/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GrafcetMaker" />
    <meta property="og:title" content="GrafcetMaker: free online GRAFCET editor and simulator" />
    <meta
      property="og:description"
      content="Draw, check and simulate GRAFCET charts (IEC 60848) in your browser. Free and open source, works offline, no account."
    />
    <meta property="og:url" content="__SITE_URL__" />
    <meta property="og:image" content="__SITE_URL__og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A GRAFCET chart drawn in GrafcetMaker, the free online GRAFCET editor"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1218" />
    <script>
      (function () {
        var m = 'system';
        try {
          m = localStorage.getItem('grafcetmaker.theme') || 'system';
        } catch (e) {}
        var d =
          m === 'dark' ||
          (m !== 'light' &&
            !!window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', d ? 'dark' : 'light');
      })();
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "name": "GrafcetMaker",
            "alternateName": ["grafcet.org", "Grafcet Maker"],
            "url": "__SITE_URL__"
          },
          {
            "@type": "SoftwareApplication",
            "name": "GrafcetMaker",
            "url": "__SITE_URL__",
            "image": "__SITE_URL__og-image.png",
            "screenshot": "__SITE_URL__og-image.png",
            "softwareHelp": { "@type": "CreativeWork", "url": "__SITE_URL__help/" },
            "description": "Free, open-source GRAFCET (IEC 60848) editor and simulator that runs in the browser: draw, validate and simulate GRAFCET charts, and export them to PDF, SVG, PNG, Structured Text and PLCopen XML.",
            "applicationCategory": "DesignApplication",
            "operatingSystem": "Any (web browser)",
            "isAccessibleForFree": true,
            "license": "https://opensource.org/licenses/MIT",
            "sameAs": ["https://github.com/AronLenvig/GrafcetMaker"],
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" },
            "featureList": [
              "GRAFCET editor with steps, transitions, receptivities and actions",
              "Simulation following the IEC 60848 evolution rules, with chronogram",
              "Validation of the chart with quick fixes",
              "Macro-steps, enclosing steps and forcing orders",
              "Export to PDF, SVG, PNG, Structured Text and PLCopen TC6 XML",
              "Works offline, no account"
            ]
          }
        ]
      }
    </script>
  </head>
  <body>
    <!-- The home page text (docs/home.md) for readers without JavaScript is rendered here at
         build time (vite.config.ts); the editor replaces it. -->
    <div id="root"><!--static-home--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
